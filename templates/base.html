<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>{% block titulo %}Livraria{% endblock %}</title>
<style>
nav { background: #333; color: white; padding: 10px; }
nav a { color: white; margin-right: 15px; text-decoration: none; }
.container { max-width: 700px; margin: 20px auto; }
.card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; }
.erro { color: red; }
input, textarea, select, button { display: block; margin-bottom: 10px;
padding: 8px; width: 100%; }
</style>
</head>
<body>
<nav>
<a href="{{ url_for('index') }}">Início</a>
{% if session.get("usuario") %}
<a href="{{ url_for('logout') }}">Sair ({{ session["usuario"] }})</a>
{% else %}
<a href="{{ url_for('login') }}">Entrar</a>
{% endif %}
</nav>
<div class="container">
{% block conteudo %}{% endblock %}
</div>
</body>
</html>
