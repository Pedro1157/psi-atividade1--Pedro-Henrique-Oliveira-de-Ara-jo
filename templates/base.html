<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Livraria{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background: #444; padding: 10px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { width: 80%; margin: 20px auto; }
        .card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .erro { color: red; }
        input, textarea, select, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('catalog.index') }}">Início</a>
        {% if session.usuario %}
            <a href="{{ url_for('auth.logout') }}">Sair ({{ session.usuario }})</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Entrar</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block conteudo %}{% endblock %}
    </div>
</body>
</html>
