{% extends "base.html" %}

{% block titulo %}Catálogo de Livros{% endblock %}

{% block conteudo %}
    <h1>catalogo de livrros</h1>

    <form method="get">
        <input type="text" name="q" value="{{ q }}" placeholder="Buscar por título">
        <button type="submit">buscar</button>
    </form>

    {% for livro in livros %}
        <div class="card">
            <h2>{{ livro.titulo }}</h2>
            <p><strong>aautor:</strong> {{ livro.autor }}</p>
            <p><strong>gênero:</strong> {{ livro.genero }}</p>
            <a href="{{ url_for('catalog.ver_livro', livro_id=livro.id) }}"> ver detalhes</a>
        </div>
    {% endfor %}
{% endblock %}
